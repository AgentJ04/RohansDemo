<template>
    <div class="ar-cell">
        <span class="ar-cell-label">{field.label}:</span>
        <span class="ar-cell-value">
            <template lwc:if={hasValue}>
                <template lwc:if={isCurrency}>
                    <lightning-formatted-number
                        value={field.value}
                        format-style="currency"
                        currency-code="USD"
                        minimum-fraction-digits="2"
                        maximum-fraction-digits="4"
                    ></lightning-formatted-number>
                </template>
                <template lwc:elseif={isPercent}>
                    <lightning-formatted-number
                        value={percentValue}
                        format-style="percent"
                        maximum-fraction-digits="2"
                    ></lightning-formatted-number>
                </template>
                <template lwc:elseif={isNumber}>
                    <lightning-formatted-number value={field.value}></lightning-formatted-number>
                </template>
                <template lwc:elseif={isDate}>
                    <lightning-formatted-date-time
                        value={field.value}
                        year="numeric"
                        month="2-digit"
                        day="2-digit"
                        time-zone="UTC"
                    ></lightning-formatted-date-time>
                </template>
                <template lwc:elseif={isDatetime}>
                    <lightning-formatted-date-time value={field.value}></lightning-formatted-date-time>
                </template>
                <template lwc:elseif={isBoolean}>
                    <lightning-formatted-text value={booleanValue}></lightning-formatted-text>
                </template>
                <template lwc:else>
                    <lightning-formatted-text value={field.value}></lightning-formatted-text>
                </template>
            </template>
            <template lwc:if={isEmpty}>
                <span class="ar-empty">&mdash;</span>
            </template>
        </span>
    </div>
</template>
